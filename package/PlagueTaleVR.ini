[Rendering]
; F3 cycles supported modes and shows the selection in the headset.
DLSS=1
; F3: Off, Quality, Balanced, Performance, Ultra Performance.
; Stable saved IDs: 0 Off, 2 Quality, 3 Balanced, 4 Performance, 5 Ultra Performance.
; Balanced starts automatically after 10 seconds of stable tracked gameplay.
; Legacy ID 1 migrates to Quality. F3 changes the selected mode.
DLSSMode=3
; Optional surface decals switch. F5 toggles and saves it; 0 keeps decals.
DisableDecals=1
; 1 forces the native effect completely off during VR; 0 leaves the game setting.
; Changes apply during play. The mod restores its original bits when VR stops.
DisableScreenSpaceReflections=1
DisableContactShadows=1
DisableAmbientOcclusion=1
DisableVolumetricLights=1
DisableVolumetricClouds=1
DisableReflectionProbes=1
DisableDepthOfField=1
DisableBloom=1
DisableChromaticAberration=1
DisableMotionBlur=1

[UI]
; Automatically place inventory and pause/options menus on an anchored screen.
MenuVirtualScreen=1
; F4 compares native mouse/controller aim reticle projection.
CorrectAimReticle=1
CorrectScreenUI=1
WidthMeters=2.4
DistanceMeters=2.0

[Diagnostics]
; Diagnostic: 0 DLSS, 1 scale only, 2 conversion only, 3 evaluate/discard.
DLSSInputAudit=0
DLSSDiagnosticMode=0
; 0 leaves the selected mode running until F3 changes it.
DLSSMaxTestPairs=0
DLSSAutoCapture=0
DLSSAutoBenchmark=0
ProjectedLightBoundsMode=1
; Accepted tiled-light projection correction. 0 restores the native shader.
LightListMode=1
DisableAuxiliaryStereoOffsets=0
DisableSunShadowSample=0
DisableCloudShadowSample=0
DisableIndirectLightingDraw=0
DisableProjectedLightingDraw=0
DisableFogSample=0

[Camera]
; Shift+F2 compares local first-person head/hair hiding.
HideFirstPersonHead=1
; F2 toggles the experimental player-root first-person camera.
FirstPerson=0
; Metres above the player root. Initial standing-camera calibration.
FirstPersonHeight=1.500000
; Horizontal forward and side offsets before HMD rotation/lean.
FirstPersonForward=0.180000
FirstPersonSide=0.000000
FollowHead=1
